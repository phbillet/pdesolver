name: Test Jupyter Notebooks

on:
  push:
    paths:
      - '*.ipynb'
      - '**/*.ipynb'
      - '*.py'
      - '**/*.py'
      - requirements.txt
  pull_request:
    paths:
      - '*.ipynb'
      - '**/*.ipynb'
      - '*.py'
      - '**/*.py'
      - requirements.txt

jobs:
  test-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest coverage nbmake

      - name: Run notebook tests with coverage
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          coverage run --source=PDESolver --parallel-mode -m pytest --nbmake ./*.ipynb
          coverage combine
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
