name: Test Jupyter Notebooks

on:
  push:
    paths:
      - '*.ipynb'
      - '**/*.ipynb'
      - '*.py'
      - '**/*.py'
      - requirements.txt
  pull_request:
    paths:
      - '*.ipynb'
      - '**/*.ipynb'
      - '*.py'
      - '**/*.py'
      - requirements.txt

jobs:
  test-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nbmake

      - name: Run notebook tests
        run: |
          pytest --nbmake ./*.ipynb

